[package]
name = "obs-chzzk-extension"
description = "NAVER Chzzk OBS Studio Extension"
version = "0.1.0"
edition = "2021"
authors = ["zeroday0619"]
license-file = "LICENSE"
repository = "https://github.com/zeroday0619/obs-chzzk-extension"
homepage = "https://github.com/zeroday0619/obs-chzzk-extension"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"
ureq = { version = "2.10", default-features = true, features = ["json"] }

[profile.release]
panic = "abort"
